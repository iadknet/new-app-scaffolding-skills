name: Bug report
description: Report a reproducible problem with a scaffold or generated project.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities here. Follow SECURITY.md instead.
  - type: dropdown
    id: scaffold
    attributes:
      label: Scaffold
      options:
        - agent-project-scaffold
        - go-project-scaffold
        - docker-bootstrap
        - repository tooling
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include the command, relevant output, operating system, and tool versions.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
